[pytest]
# 用例目录
testpaths = testcases contract

# 命名规范
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认输出：详细 + 显示最慢的 10 个用例
addopts = -v -ra --durations=10 --strict-markers

# 自定义标记（--strict-markers 会强制声明，避免拼写错导致用例被漏跑）
markers =
    auth: 鉴权模块（模块1）
    ratelimit: 限流模块（模块2）——串行执行，独占限流桶
    routing: 路由与反向代理（模块3）
    loadbalance: 负载均衡轮询（模块4）
    breaker: 熔断器状态机（模块5）——串行，含冷却等待
    ops: 运维探针/可观测（模块6）
    contract: OpenAPI 契约测试
    security: 安全专项（算法混淆/身份伪造/后门）
    slow: 含 sleep 等待（冷却/令牌恢复），耗时较长

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(message)s
log_cli_date_format = %H:%M:%S
