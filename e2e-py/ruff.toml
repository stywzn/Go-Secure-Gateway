# ruff 配置 —— 显式锁定规则集。
#
# 为什么要有这个文件：不配置的话 ruff 用「当前版本的默认规则集」，而默认集会随
# ruff 升级而变化。CI 里一旦装了新版 ruff，就可能凭空冒出一批新错误让流水线变红
# （与本仓库 golangci-lint 曾用 `version: latest` 翻车是同一类问题）。
# 显式 select 之后，规则只在这里改，升级 ruff 不会意外破坏 CI。
#
# 配置放在 e2e-py/ 而不是仓库根：根目录下的 tests/ 与 e2e/ 是只读参考实现，
# 不纳入本框架的 lint 管辖范围。

line-length = 88
target-version = "py312"
exclude = [".venv", "allure-report", "allure-results", "reports", "__pycache__"]

[lint]
# 规则集与姊妹项目 ui-automatic-test 保持一致：
#   E4/E7/E9 + F  pycodestyle 错误 + pyflakes（未用导入、未定义名字等）
#   I             import 排序（isort）
#   B             flake8-bugbear（可疑写法、易错模式）
#   PERF          perflint（性能反模式）
select = ["E4", "E7", "E9", "F", "I", "B", "PERF"]

[lint.isort]
# 告诉 ruff `framework` 是本项目模块。pytest.ini 里配了 `pythonpath = .`，
# 用例通过 `from framework.xxx import` 导入；ruff 默认会把它当第三方库，
# 于是要求它和 requests / pytest 混在同一个 import 块里 —— 那会破坏
# 「标准库 / 第三方 / 本项目」的三段式分组。声明为 first-party 后分组才正确。
known-first-party = ["framework"]
