# End-to-end demo stack:
#   web (nginx)  -> serves the demo frontend and reverse-proxies /api -> gateway
#   gateway      -> JWT auth, rate limit, routing, load balancing, circuit breaker
#   backend-*    -> mock echo services (two "storage" replicas show round-robin LB)
#
# Quick start:
#   docker compose up --build
#   open http://localhost:8088        (demo frontend)
#   or curl the gateway directly on   http://localhost:8080
name: go-secure-gateway

x-mock-backend: &mock-backend
  build:
    context: .
    dockerfile: Dockerfile.mock
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 3
  restart: unless-stopped

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG_PATH: /app/configs/config.docker.yaml
      JWT_SECRET: compose-dev-secret
    volumes:
      - ./configs/config.docker.yaml:/app/configs/config.docker.yaml:ro
    ports:
      - "8080:8080" # direct access for curl / debugging
    depends_on:
      backend-interaction:
        condition: service_healthy
      backend-storage:
        condition: service_healthy
      backend-storage-2:
        condition: service_healthy
      backend-compute:
        condition: service_healthy
      backend-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  backend-interaction:
    <<: *mock-backend
    environment:
      SERVICE_NAME: interaction

  backend-storage:
    <<: *mock-backend
    environment:
      SERVICE_NAME: storage-a

  backend-storage-2:
    <<: *mock-backend
    environment:
      SERVICE_NAME: storage-b

  backend-compute:
    <<: *mock-backend
    environment:
      SERVICE_NAME: compute

  backend-data:
    <<: *mock-backend
    environment:
      SERVICE_NAME: data

  web:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # ---- Monitoring (opt-in): docker compose --profile monitoring up ----
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Lightweight log aggregation, reuses Grafana as the UI.
  loki:
    image: grafana/loki:3.1.1
    profiles: ["monitoring"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    profiles: ["monitoring"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped

  # ---- Standby ELK stack (backup, NOT started by default) ----
  # Enable explicitly:  docker compose --profile logging-elk up
  # Heavy: Elasticsearch alone wants ~1GB+ RAM. Kept as an alternative to Loki.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    profiles: ["logging-elk"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    profiles: ["logging-elk"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.1
    profiles: ["logging-elk"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./observability/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped
