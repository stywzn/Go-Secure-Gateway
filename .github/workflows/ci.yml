name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          # 只查本模块自己的包目录。原来写的是 `gofmt -l .`，会连 vendor/ 里的
          # 第三方代码一起扫（403 个文件不合规），导致这一步必然失败。
          # `go list ./...` 在 vendor 模式下只返回本模块的包，天然排除 vendor。
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        # action 必须 v7+ 才能带 golangci-lint v2。原来 v6 + `version: latest`
        # 拉到的是用 go1.24 构建的 v1.x，而 go.mod 目标是 1.25.0，直接报
        # "the Go language version (go1.24) ... is lower than the targeted Go version (1.25.0)"。
        # 版本写死而不用 latest：latest 会随上游漂移，正是这次翻车的原因。
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: go-secure-gateway:ci
      - name: Build mock backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mock
          push: false
          tags: go-secure-gateway-mock:ci
