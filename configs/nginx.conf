# Optional edge proxy: terminate TLS and load-balance across gateway replicas.
# The gateway itself already does auth / rate limiting / routing, so nginx here
# is only an L7 entry point.

upstream go_secure_gateway {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8090 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Health checks bypass upstream auth concerns.
    location = /healthz {
        proxy_pass http://go_secure_gateway;
    }

    location / {
        proxy_pass http://go_secure_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
